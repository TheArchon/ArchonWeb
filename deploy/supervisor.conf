[program:archon-session-api]
directory=/opt/archon-session-labs/backend
command=/opt/archon-session-labs/backend/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/archon-session-api.log
stderr_logfile=/var/log/archon-session-api-error.log
environment=PYTHONUNBUFFERED="1"
